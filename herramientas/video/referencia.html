<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../fonts/fuentes.css" />
<style>
  /* Lámina de referencia bibliográfica para reels: ?img=img/archivo.jpg&eyebrow=…&nota=… */
  :root{--tinta:#121a45;--tinta-suave:#5b6480;--azul-tinta:#0b6fb0;--celeste-borde:#cfe6f7;--grad:linear-gradient(135deg,#1aa7ec 0%,#2457c4 55%,#1e2f97 100%)}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased}
  body{display:grid;place-items:center;background:radial-gradient(80% 60% at 50% 40%,#ffffff 0%,#f3f7fc 70%,#e9f1fb 100%)}
  .bloque{display:flex;flex-direction:column;align-items:center;gap:34px;width:920px}
  .eyebrow{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--azul-tinta)}
  .eyebrow::before{content:"";width:46px;height:5px;border-radius:5px;background:var(--grad)}
  .tarjeta{width:100%;background:#fff;border:1px solid var(--celeste-borde);border-radius:32px;padding:38px 40px;box-shadow:0 30px 70px rgba(18,26,69,.14);position:relative;overflow:hidden}
  .tarjeta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--grad)}
  .tarjeta img{display:block;width:100%;height:auto}
  .nota{font-size:30px;font-weight:600;line-height:1.4;color:var(--tinta-suave);text-align:center;max-width:820px}
  .marca{display:flex;align-items:center;gap:14px;margin-top:10px}
  .marca svg{width:56px;height:56px}
  .marca b{font-size:28px;font-weight:800;color:var(--tinta)}
</style>
</head>
<body>
  <div class="bloque">
    <div class="eyebrow" id="eyebrow">El estudio</div>
    <div class="tarjeta"><img id="img" src="img/estudio-metotrexato-alcohol.jpg" alt=""></div>
    <p class="nota" id="nota"></p>
    <div class="marca">
      <svg viewBox="0 0 100 100" aria-hidden="true"><defs>
        <linearGradient id="gp" gradientUnits="userSpaceOnUse" x1="50" y1="92" x2="50" y2="22"><stop offset="0" stop-color="#1e2f97"/><stop offset=".55" stop-color="#1aa7ec"/><stop offset="1" stop-color="#4adfdd"/></linearGradient>
        <linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="50" y1="62" x2="50" y2="26"><stop offset="0" stop-color="#797ef6"/><stop offset="1" stop-color="#7dd6f8"/></linearGradient></defs>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
          <path d="M43 92 V62 C43 54 40 49 35 42 L23 24" stroke="url(#gp)"/><path d="M57 92 V62 C57 54 60 49 65 42 L77 24" stroke="url(#gp)"/>
          <path d="M30.5 59 L12.5 30" stroke="url(#gl)"/><path d="M69.5 59 L87.5 30" stroke="url(#gl)"/></g></svg>
      <b>Dr. Daniel Mora</b>
    </div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('img')) document.getElementById('img').src = q.get('img');
  if (q.has('eyebrow')) document.getElementById('eyebrow').textContent = q.get('eyebrow');
  const nota = document.getElementById('nota');
  q.get('nota') ? nota.textContent = q.get('nota') : nota.remove();
</script>
</body>
</html>
