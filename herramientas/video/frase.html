<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../fonts/fuentes.css" />
<style>
  /* Pantalla de frase (cuadro completo) antes del cierre: mismo lenguaje del preloader y del cierre.
     ?texto=Ya vámonos a hacer|ejercicio  → "|" separa líneas; la última línea va en Fraunces itálica con degradado
     ?eyebrow=…  rótulo pequeño arriba de la frase (vacío = sin rótulo)   ?iso=1 muestra el isotipo arriba (por defecto no: se repite con el cierre)
     ?t= &vel= igual que outro.html */
  :root{--tinta:#121a45;--tinta-suave:#5b6480;--azul-tinta:#0b6fb0;--celeste-borde:#cfe6f7;--grad-marca:linear-gradient(135deg,#1aa7ec 0%,#2457c4 55%,#1e2f97 100%)}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased}
  #frase{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(80% 60% at 50% 40%,#ffffff 0%,#f3f7fc 70%,#e9f1fb 100%)}
  .bloque{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 80px;width:100%}
  .iso{width:150px;height:150px;overflow:visible;margin-bottom:54px}
  .iso path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:9;stroke-dasharray:140;stroke-dashoffset:140;animation:trazo .9s cubic-bezier(.4,0,.2,1) forwards}
  .iso .p1{animation-delay:.05s}.iso .p2{animation-delay:.2s}
  .iso .l1{stroke-dasharray:60;stroke-dashoffset:60;animation-delay:.5s}
  .iso .l2{stroke-dasharray:60;stroke-dashoffset:60;animation-delay:.62s}
  @keyframes trazo{to{stroke-dashoffset:0}}
  .eyebrow{font-size:24px;font-weight:700;letter-spacing:.42em;text-transform:uppercase;color:var(--azul-tinta);margin-bottom:34px;opacity:0;animation:abrir .7s ease forwards .45s}
  .eyebrow:empty{display:none}
  @keyframes abrir{from{opacity:0;letter-spacing:.42em}to{opacity:1;letter-spacing:.22em}}
  .linea{display:block;font-weight:800;font-size:104px;letter-spacing:-0.025em;line-height:1.08;color:var(--tinta);white-space:nowrap;opacity:0;transform:translateY(40px);animation:subir .6s cubic-bezier(.2,.8,.2,1) forwards}
  .linea.final{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:400;font-size:196px;letter-spacing:-0.01em;line-height:1.02;margin-top:6px;
    background:var(--grad-marca);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
  @keyframes subir{to{opacity:1;transform:none}}
  .barra{width:220px;height:7px;border-radius:7px;margin-top:54px;background:var(--grad-marca);transform:scaleX(0);transform-origin:left;animation:crecer .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes crecer{to{transform:scaleX(1)}}
  .pie{position:absolute;left:0;right:0;bottom:14vh;text-align:center;font-size:27px;font-weight:700;letter-spacing:.02em;color:var(--tinta-suave);opacity:0;animation:subir .55s ease forwards}
  .pie strong{color:var(--tinta);font-weight:800}
</style>
</head>
<body>
<div id="frase" aria-hidden="true">
  <div class="bloque">
    <svg class="iso" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="gp" gradientUnits="userSpaceOnUse" x1="50" y1="92" x2="50" y2="22"><stop offset="0" stop-color="#1e2f97"/><stop offset=".55" stop-color="#1aa7ec"/><stop offset="1" stop-color="#4adfdd"/></linearGradient>
        <linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="50" y1="62" x2="50" y2="26"><stop offset="0" stop-color="#797ef6"/><stop offset="1" stop-color="#7dd6f8"/></linearGradient>
      </defs>
      <path class="p1" d="M43 92 V62 C43 54 40 49 35 42 L23 24" stroke="url(#gp)"/>
      <path class="p2" d="M57 92 V62 C57 54 60 49 65 42 L77 24" stroke="url(#gp)"/>
      <path class="l1" d="M30.5 59 L12.5 30" stroke="url(#gl)"/>
      <path class="l2" d="M69.5 59 L87.5 30" stroke="url(#gl)"/>
    </svg>
    <div class="eyebrow" id="eyebrow"></div>
    <div id="lineas"></div>
    <div class="barra" id="barra"></div>
  </div>
  <div class="pie" id="pie"><strong>Dr. Daniel Mora</strong> · Reumatólogo</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const t = parseFloat(q.get('t') || '0'), vel = parseFloat(q.get('vel') || '1');
  if (q.has('eyebrow')) document.getElementById('eyebrow').textContent = q.get('eyebrow');
  if (!q.get('iso')) document.querySelector('.iso').remove();
  const texto = q.get('texto') || 'Ya vámonos a hacer|ejercicio';
  const partes = texto.split('|'); const cont = document.getElementById('lineas');
  partes.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'linea' + (i === partes.length - 1 ? ' final' : ''); d.textContent = p.trim();
    d.style.animationDelay = (0.55 + i * 0.22) + 's'; cont.appendChild(d);
  });
  const fin = 0.55 + (partes.length - 1) * 0.22;
  document.getElementById('barra').style.animationDelay = (fin + 0.35) + 's';
  document.getElementById('pie').style.animationDelay = (fin + 0.5) + 's';
  // ajuste: que ninguna línea se salga del ancho útil (920 px)
  document.fonts.ready.then(() => {
    document.querySelectorAll('.linea').forEach(el => { let fs = parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth > 920 && fs > 40) { fs -= 4; el.style.fontSize = fs + 'px'; } });
    document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * vel * 1000; });
  });
</script>
</body>
</html>
