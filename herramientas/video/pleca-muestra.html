<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../fonts/fuentes.css" />
<style>
  :root{--cielo:#7dd6f8;--azul:#1aa7ec;--marino:#1e2f97;--tinta:#121a45;--grad:linear-gradient(135deg,#1aa7ec 0%,#2457c4 55%,#1e2f97 100%)}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased}
  body{position:relative;background:#0b1430 url('../../images/web/consultorio1-1800.webp') 62% center/cover}
  body::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(5,10,30,.55),rgba(5,10,30,.05) 50%)}
  .iso{width:100%;height:100%;overflow:visible}

  /* ---------- Variante A: tarjeta blanca con filo de marca ---------- */
  .a{position:absolute;left:56px;bottom:540px;display:flex;align-items:center;gap:22px;padding:22px 34px 22px 26px;background:#fff;border-radius:20px;box-shadow:0 18px 50px rgba(5,10,30,.35)}
  .a::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:7px;border-radius:7px;background:var(--grad)}
  .a .ico{width:72px;height:72px;margin-left:10px}
  .a .nombre{font-size:44px;font-weight:800;letter-spacing:-.8px;color:var(--tinta);line-height:1.05}
  .a .rol{margin-top:8px;font-size:19px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#0b6fb0}

  /* ---------- Variante B: barra con degradado de marca ---------- */
  .b{position:absolute;left:56px;bottom:540px;display:flex;align-items:stretch;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(5,10,30,.4)}
  .b .cuadro{width:104px;display:grid;place-items:center;background:var(--grad)}
  .b .cuadro .ico{width:64px;height:64px}
  .b .texto{padding:20px 38px 22px 30px;background:rgba(10,17,36,.78);backdrop-filter:blur(10px);color:#fff}
  .b .nombre{font-size:44px;font-weight:800;letter-spacing:-.8px;line-height:1.05}
  .b .rol{margin-top:8px;font-size:19px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--cielo)}
  .b .linea{position:absolute;left:104px;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--cielo),var(--azul))}

  .etq{position:absolute;top:150px;left:56px;font-size:26px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:10px 18px;border-radius:10px;letter-spacing:.08em}
  .guia{position:absolute;border:3px dashed rgba(255,80,80,.85);background:rgba(255,80,80,.12);color:#fff;font-size:22px;font-weight:700;padding:14px;display:none}
  body.guias .guia{display:block}
  .g-abajo{left:0;right:0;bottom:0;height:500px}
  .g-der{right:0;top:900px;width:150px;bottom:500px}
  .g-arriba{left:0;right:0;top:0;height:220px}
  body.solo{background:transparent}body.solo::before,body.solo .etq{display:none}
</style>
</head>
<body>
<div class="etq" id="etq"></div>
<div class="guia g-arriba">Zona que tapan los controles de arriba</div>
<div class="guia g-der"></div>
<div class="guia g-abajo">Zona que tapan la descripción, el usuario y la música</div>

<div class="a" id="A">
  <svg class="ico iso" viewBox="0 0 100 100"><defs>
    <linearGradient id="gp" gradientUnits="userSpaceOnUse" x1="50" y1="92" x2="50" y2="22"><stop offset="0" stop-color="#1e2f97"/><stop offset=".55" stop-color="#1aa7ec"/><stop offset="1" stop-color="#4adfdd"/></linearGradient>
    <linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="50" y1="62" x2="50" y2="26"><stop offset="0" stop-color="#797ef6"/><stop offset="1" stop-color="#7dd6f8"/></linearGradient></defs>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
      <path d="M43 92 V62 C43 54 40 49 35 42 L23 24" stroke="url(#gp)"/><path d="M57 92 V62 C57 54 60 49 65 42 L77 24" stroke="url(#gp)"/>
      <path d="M30.5 59 L12.5 30" stroke="url(#gl)"/><path d="M69.5 59 L87.5 30" stroke="url(#gl)"/></g></svg>
  <div><div class="nombre">Dr. Daniel Mora</div><div class="rol">Reumatólogo · León, Gto.</div></div>
</div>

<div class="b" id="B">
  <div class="cuadro"><svg class="ico iso" viewBox="0 0 100 100">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
      <path d="M43 92 V62 C43 54 40 49 35 42 L23 24" stroke="#fff"/><path d="M57 92 V62 C57 54 60 49 65 42 L77 24" stroke="#fff"/>
      <path d="M30.5 59 L12.5 30" stroke="#7dd6f8"/><path d="M69.5 59 L87.5 30" stroke="#7dd6f8"/></g></svg></div>
  <div class="texto"><div class="nombre">Dr. Daniel Mora</div><div class="rol">Reumatólogo · León, Gto.</div></div>
  <div class="linea"></div>
</div>

<script>
  const q=new URLSearchParams(location.search), v=q.get('v')||'A';
  document.getElementById('A').style.display = v==='A'?'':'none';
  document.getElementById('B').style.display = v==='B'?'':'none';
  if (q.get('guias')) document.body.classList.add('guias');
  if (q.get('solo')) document.body.classList.add('solo');
  document.getElementById('etq').textContent = q.get('etq')||('VARIANTE '+v);
  if (q.get('nombre')) document.querySelectorAll('.nombre').forEach(e=>e.textContent=q.get('nombre'));
  if (q.get('rol')) document.querySelectorAll('.rol').forEach(e=>e.textContent=q.get('rol'));
</script>
</body>
</html>
