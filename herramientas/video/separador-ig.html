<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../fonts/fuentes.css" />
<style>
  /* Fila separadora para la cuadrícula de Instagram: una sola composición de 3 × 1080×1350 que luego se parte en tres. */
  :root{--cielo:#7dd6f8;--turquesa:#4adfdd;--grad:linear-gradient(135deg,#1aa7ec 0%,#2457c4 55%,#1e2f97 100%)}
  *{box-sizing:border-box;margin:0}
  html,body{width:3240px;height:1350px;overflow:hidden;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased}
  body{position:relative;background:var(--grad);color:#fff}
  .linea{position:absolute;left:0;right:0;top:50%;height:6px;transform:translateY(-50%);background:linear-gradient(90deg,rgba(125,214,248,0) 0%,var(--cielo) 18%,var(--turquesa) 50%,var(--cielo) 82%,rgba(125,214,248,0) 100%);opacity:.9}
  .agua{position:absolute;top:50%;transform:translateY(-50%);width:820px;height:820px;opacity:.12}
  .agua.izq{left:140px}.agua.der{right:140px;transform:translateY(-50%) scaleX(-1)}
  .agua svg{width:100%;height:100%;overflow:visible}
  .centro{position:absolute;left:1080px;width:1080px;top:0;bottom:0;display:grid;place-items:center}
  .tarjeta{display:flex;flex-direction:column;align-items:center;gap:34px;text-align:center;padding:70px 60px;background:rgba(10,17,36,.28);border:1px solid rgba(255,255,255,.22);border-radius:40px;backdrop-filter:blur(8px)}
  .tarjeta svg{width:230px;height:230px;overflow:visible}
  .nombre{font-size:84px;font-weight:800;letter-spacing:-1.5px;line-height:1}
  .sub{font-size:28px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:var(--cielo);margin-top:14px}
  .web{margin-top:16px;padding:18px 36px;border-radius:999px;background:#fff;color:#1e2f97;font-size:30px;font-weight:800}
  .lado{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.85)}
  .lado.izq{left:0;width:1080px;text-align:center;padding-top:560px}
  .lado.der{right:0;width:1080px;text-align:center;padding-top:560px}
</style>
</head>
<body>
  <div class="linea"></div>
  <div class="agua izq"><svg viewBox="0 0 100 100"><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="9"><path d="M43 92 V62 C43 54 40 49 35 42 L23 24"/><path d="M57 92 V62 C57 54 60 49 65 42 L77 24"/><path d="M30.5 59 L12.5 30"/><path d="M69.5 59 L87.5 30"/></g></svg></div>
  <div class="agua der"><svg viewBox="0 0 100 100"><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="9"><path d="M43 92 V62 C43 54 40 49 35 42 L23 24"/><path d="M57 92 V62 C57 54 60 49 65 42 L77 24"/><path d="M30.5 59 L12.5 30"/><path d="M69.5 59 L87.5 30"/></g></svg></div>
  <div class="lado izq">Reumatología</div>
  <div class="lado der">León · Guanajuato</div>
  <div class="centro">
    <div class="tarjeta">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="9">
          <path d="M43 92 V62 C43 54 40 49 35 42 L23 24" stroke="#fff"/><path d="M57 92 V62 C57 54 60 49 65 42 L77 24" stroke="#fff"/>
          <path d="M30.5 59 L12.5 30" stroke="#7dd6f8"/><path d="M69.5 59 L87.5 30" stroke="#7dd6f8"/></g></svg>
      <div><div class="nombre">Dr. Daniel Mora</div><div class="sub">Reumatólogo</div></div>
      <div class="web">reumadanmora.com</div>
    </div>
  </div>
</body>
</html>
