<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../fonts/fuentes.css" />
<style>
  /* Tarjeta de punto numerado para reels (1, 2, 3…): número grande + rótulo corto. ?n=1&texto=…&de=3 */
  :root{--cielo:#7dd6f8;--turquesa:#4adfdd;--marino:#1e2f97;--grad:linear-gradient(135deg,#1aa7ec 0%,#2457c4 55%,#1e2f97 100%)}
  *{box-sizing:border-box;margin:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased}
  .tarjeta{position:absolute;left:0;right:0;margin-inline:auto;width:fit-content;top:780px;display:flex;align-items:center;gap:26px;padding:22px 40px 22px 24px;
    background:rgba(10,17,36,.80);border:1px solid rgba(255,255,255,.22);border-radius:24px;box-shadow:0 20px 50px rgba(5,10,30,.45);max-width:920px}
  .num{width:124px;height:124px;border-radius:20px;background:var(--grad);display:grid;place-items:center;flex:none;position:relative}
  .num b{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:400;font-size:92px;line-height:1;color:#fff}
  .num::after{content:attr(data-de);position:absolute;right:10px;bottom:8px;font-size:16px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.75)}
  .texto{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:720px}
  .texto span{font-size:17px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--cielo)}
  .texto strong{font-size:46px;font-weight:800;letter-spacing:-.6px;line-height:1.1;color:#fff}
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="num" id="num"><b id="n">1</b></div>
    <div class="texto"><span id="eyebrow">Señal de alarma</span><strong id="texto">Dura más de 30 minutos</strong></div>
  </div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('n')) document.getElementById('n').textContent = q.get('n');
  if (q.get('de')) document.getElementById('num').dataset.de = '/' + q.get('de');
  if (q.get('texto')) document.getElementById('texto').textContent = q.get('texto');
  if (q.has('eyebrow')) document.getElementById('eyebrow').textContent = q.get('eyebrow');
  if (q.get('y')) document.querySelector('.tarjeta').style.top = q.get('y') + 'px';   // altura de la tarjeta (por defecto 780)
</script>
</body>
</html>
