<!DOCTYPE html>
<html lang="es-MX"><head><meta charset="utf-8"><title>Muestra de marca · Dr. Daniel Mora</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f3f7fc;font-family:Manrope,sans-serif;color:#121a45;padding:40px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:1100px;margin:0 auto}
.t{background:#fff;border:1px solid #e2e8f3;border-radius:20px;padding:36px;display:flex;align-items:center;justify-content:center;min-height:220px}
.t.sat{background:linear-gradient(135deg,#1aa7ec 0%,#2457c4 55%,#1e2f97 100%)}
.t.wide{grid-column:span 2}
.t img{max-width:100%}
.pal{display:flex;gap:12px;width:100%}
.pal div{flex:1;height:110px;border-radius:999px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:12px;font-weight:800;color:#fff;letter-spacing:.06em}
</style></head><body>
<div class="grid">
  <div class="t wide"><img src="logo.svg" alt="Logo" style="width:620px"></div>
  <div class="t"><img src="icono.svg" alt="Isotipo" style="width:220px"></div>
  <div class="t sat"><img src="icono-blanco.svg" alt="Isotipo blanco" style="width:220px"></div>
  <div class="t wide"><div class="pal">
    <div style="background:#7dd6f8">#7DD6F8</div><div style="background:#797ef6">#797EF6</div><div style="background:#4adfdd">#4ADFDD</div><div style="background:#1aa7ec">#1AA7EC</div><div style="background:#1e2f97">#1E2F97</div>
  </div></div>
</div>
</body></html>
